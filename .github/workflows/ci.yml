name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Brain-only commits land on main directly; they carry no code to check.
    paths-ignore:
      - ".brain/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.11"   # requires-python floor; catches newer-only syntax
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install (fails if uv.lock is out of date)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Unit tests (integration tests excluded by pytest addopts)
        run: uv run pytest
