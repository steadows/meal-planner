[project]
name = "meals"
version = "0.1.0"
description = "Meal planning assistant: pantry, Mealie, Telegram bot and Meijer cart fill"
requires-python = ">=3.11"
# One dependency per line, alphabetised. Lanes: add lines, don't edit existing ones.
dependencies = [
    "filelock>=4.0",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
]

[dependency-groups]
# One dependency per line, alphabetised. Lanes: add lines, don't edit existing ones.
dev = [
    "import-linter>=2.15",
    "mypy>=2.3",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: hits a real service (Mealie, Telegram, Chrome/Meijer, claude -p); run with -m integration",
]

# ── ruff ───────────────────────────────────────────────────────────────────
# CI runs `ruff check .` and `ruff format --check .`. Lanes: add per-file ignores below; don't
# loosen the shared rule set.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]

# ── mypy ───────────────────────────────────────────────────────────────────
# CI runs bare `mypy`. Lanes: add a [[tool.mypy.overrides]] block for your module if you need one
# (e.g. an untyped third-party library); don't relax the global settings.

[tool.mypy]
python_version = "3.11"
files = ["meals", "tests"]
plugins = ["pydantic.mypy"]
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── import-linter ──────────────────────────────────────────────────────────
# PLAN.md, Definition of done. Enforced by tests/test_contracts.py.
# Lanes: add a new [[tool.importlinter.contracts]] block; changing these goes through contracts.

[tool.importlinter]
root_package = "meals"

# Higher layers may import lower ones, never the reverse. "|" = siblings may not import each other.
# (name) = optional, so the contract holds before that lane's module exists.
# fakes sits on top so no production module can import a fake; tests live outside the package.
[[tool.importlinter.contracts]]
name = "Module layering (PLAN.md, Definition of done)"
type = "layers"
containers = ["meals"]
layers = [
    "(fakes)",
    "(bot) | (jobs) | (mcp_tools) | (__main__)",
    "(pantry) | (mealie_client) | (search) | (planner) | (cart)",
    "(db) | (claude_runner) | (rollup)",
    "contracts | (config)",
]
